name: Apply Procedural Reef Fish Integration Fast

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-fish-integration-fast.yml"
      - ".integration/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusfactory-kits-integration-fast
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and unpack exact payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/nexusfactory-kits-integration.b64
          while IFS= read -r part; do
            cat ".integration/payload/$part" >> /tmp/nexusfactory-kits-integration.b64
          done < .integration/payload-order.txt
          base64 --decode /tmp/nexusfactory-kits-integration.b64 > /tmp/nexusfactory-kits-integration.tar.gz
          sha256sum --check .integration/sha256.txt
          tar -tzf /tmp/nexusfactory-kits-integration.tar.gz | LC_ALL=C sort > /tmp/archive-files.txt
          LC_ALL=C sort .integration/manifest.txt > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/archive-files.txt; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          tar -xzf /tmp/nexusfactory-kits-integration.tar.gz
          rm -rf .integration
          rm -f .github/workflows/apply-fish-integration.yml
          rm -f .github/workflows/apply-fish-integration-fast.yml

      - name: Reject Node-only imports in registered browser runtime
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "from ['\"]node:|import\(['\"]node:|require\(['\"]node:" \
            src/domains/factory/object/creature \
            src/contracts.js src/domain.js src/foundation/glb.js; then
            echo "Node-only import reached the registered browser runtime" >&2
            exit 1
          fi

      - name: Validate registry and all tests
        run: npm run validate

      - name: Commit final integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Integration payload produced no changes" >&2
            exit 1
          fi
          git commit -m "Add Procedural Reef Fish kit"
          git push origin HEAD:main
