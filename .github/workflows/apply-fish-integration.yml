name: Apply Procedural Reef Fish Integration

on:
  push:
    branches: [main]
    paths:
      - ".integration/**"
      - ".github/workflows/apply-fish-integration.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexusfactory-kits-integration
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify and unpack integration payload
        shell: bash
        run: |
          set -euo pipefail
          cat .integration/payload/*.part > /tmp/nexusfactory-kits-integration.b64
          base64 --decode /tmp/nexusfactory-kits-integration.b64 > /tmp/nexusfactory-kits-integration.tar.gz
          sha256sum --check .integration/sha256.txt
          tar -tzf /tmp/nexusfactory-kits-integration.tar.gz | LC_ALL=C sort > /tmp/archive-files.txt
          LC_ALL=C sort .integration/manifest.txt > /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/archive-files.txt
          if grep -E '(^/|(^|/)\.\.(/|$))' /tmp/archive-files.txt; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          tar -xzf /tmp/nexusfactory-kits-integration.tar.gz
          rm -rf .integration .github/workflows/apply-fish-integration.yml

      - name: Validate public browser-safe imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE "from ['\"]node:|import\(['\"]node:|require\(['\"]node:" \
            src/domains/factory/object/creature \
            src/contracts.js src/domain.js src/foundation/glb.js; then
            echo "Node-only import reached the registered browser runtime" >&2
            exit 1
          fi

      - name: Validate registry and complete test suite
        run: npm run validate

      - name: Validate existing demos
        run: npm run demo

      - name: Generate and inspect fish smoke artifact
        shell: bash
        run: |
          set -euo pipefail
          npm run fish:generate -- --seed ci-smoke-001 --output validation/fish/ci-smoke
          npm run fish:validate -- --artifact validation/fish/ci-smoke/artifact.json
          npm run fish:inspect -- --input "$(find validation/fish/ci-smoke -name '*.glb' -print -quit)"

      - name: Validate twenty-fish representative batch
        run: npm run fish:batch -- --count 20 --output validation/fish/ci-batch

      - name: Run seven automated review loops
        run: >-
          npm run fish:review --
          --seed ci-review-001
          --output validation/fish/ci-review
          --params '{"quality":"preview","speciesFamily":"oval","tailProfile":"forked","patternType":"bands","palette":"azureGold","eyeProfile":"amber","mouthProfile":"terminal"}'

      - name: Commit final integration and generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Integration payload produced no changes" >&2
            exit 1
          fi
          git commit -m "Add Procedural Reef Fish kit"
          git push origin HEAD:main
